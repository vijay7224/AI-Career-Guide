<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobHub AI - Gemini Assistant</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#6366f1,#ec4899);
            height:100vh;
            overflow:hidden;
        }

        .chat-container{
            width:100%;
            max-width:900px;
            height:95vh;
            margin:20px auto;
            background:white;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0 20px 50px rgba(0,0,0,0.2);
        }

        .chat-header{
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white;
            padding:20px;
            font-size:1.3rem;
            font-weight:bold;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:25px;
            background:#f8fafc;
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .message{
            max-width:80%;
            padding:15px 20px;
            border-radius:20px;
            line-height:1.6;
            font-size:1rem;
            animation:fade 0.3s ease;
        }

        @keyframes fade{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .user-message{
            background:#4f46e5;
            color:white;
            align-self:flex-end;
            border-bottom-right-radius:5px;
        }

        .bot-message{
            background:white;
            border:1px solid #e5e7eb;
            align-self:flex-start;
            border-bottom-left-radius:5px;
        }

        .chat-input{
            padding:20px;
            background:white;
            border-top:1px solid #e5e7eb;
        }

        .input-box{
            display:flex;
            align-items:center;
            gap:10px;
            background:#f1f5f9;
            border-radius:50px;
            padding:8px;
        }

        #userInput{
            flex:1;
            border:none;
            background:transparent;
            outline:none;
            padding:15px 20px;
            font-size:1rem;
        }

        .send-btn{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#4f46e5;
            color:white;
            cursor:pointer;
            font-size:1.1rem;
            transition:0.3s;
        }

        .send-btn:hover{
            transform:scale(1.05);
            background:#4338ca;
        }

        .welcome{
            text-align:center;
            margin:auto;
            color:#374151;
        }

        .welcome h1{
            font-size:2.5rem;
            margin-bottom:10px;
        }

        .typing{
            display:flex;
            gap:5px;
            padding:10px;
        }

        .typing span{
            width:8px;
            height:8px;
            background:#6b7280;
            border-radius:50%;
            animation:bounce 1s infinite;
        }

        .typing span:nth-child(2){
            animation-delay:0.2s;
        }

        .typing span:nth-child(3){
            animation-delay:0.4s;
        }

        @keyframes bounce{
            0%,100%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-5px);
            }
        }

    </style>

</head>
<body>

<div class="chat-container">

    <!-- Header -->

    <div class="chat-header">
        <i class="fas fa-robot"></i>
        JobHub AI Assistant
    </div>

    <!-- Messages -->

    <div class="messages" id="messages">

        <div class="welcome">
            <h1>Hello 👋</h1>
            <p>Ask me anything about Resume, Jobs, AI, Interview, Career</p>
        </div>

    </div>

    <!-- Input -->

    <div class="chat-input">

        <div class="input-box">

            <input
                type="text"
                id="userInput"
                placeholder="Ask anything..."
                autocomplete="off">

            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>

        </div>

    </div>

</div>

<script>

    const messagesDiv =
        document.getElementById("messages");

    const userInput =
        document.getElementById("userInput");

    function addMessage(text,isUser){

        const div =
            document.createElement("div");

        div.className =
            `message ${isUser ? 'user-message' : 'bot-message'}`;

        div.innerHTML = text;

        messagesDiv.appendChild(div);

        messagesDiv.scrollTop =
            messagesDiv.scrollHeight;
    }

    function showTyping(){

        const typing =
            document.createElement("div");

        typing.className =
            "message bot-message";

        typing.id = "typing";

        typing.innerHTML = `
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        messagesDiv.appendChild(typing);

        messagesDiv.scrollTop =
            messagesDiv.scrollHeight;
    }

    function removeTyping(){

        const typing =
            document.getElementById("typing");

        if(typing){
            typing.remove();
        }
    }

    async function sendMessage(){

        const text =
            userInput.value.trim();

        if(!text) return;

        addMessage(text,true);

        userInput.value = "";

        showTyping();

        try{

            const response =
                await fetch("/chat",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })

                });

            const data =
                await response.json();

            removeTyping();

            addMessage(data.reply,false);

        }

        catch(error){

            removeTyping();

            addMessage(
                "Error connecting to AI server",
                false
            );

            console.log(error);

        }

    }

    userInput.addEventListener("keypress",(e)=>{

        if(e.key === "Enter"){
            sendMessage();
        }

    });

</script>

</body>
</html>
